[PHP]
post_max_size = 300M
upload_max_filesize = 300M
variables_order = EGPCS
pcov.directory = .

; Perf: este projeto roda de um bind-mount Windows->WSL2 (stat() ~100x mais
; lento que o filesystem nativo do container, medido em 2026-07-16). Sem
; opcache.enable_cli, cada "php artisan ..." recompila tudo do zero nesse
; caminho lento a cada chamada (6-18s medidos). Habilitar aqui deixa o cache
; de bytecode compartilhado (SHM) sobreviver entre execuções separadas do
; artisan dentro do mesmo container — a 1ª chamada após subir o container
; ainda aquece do zero, as seguintes reaproveitam o cache.
opcache.enable_cli = 1
opcache.max_accelerated_files = 40000
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
